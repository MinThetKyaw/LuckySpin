<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lucky Draw System - ကံစမ်းမဲစနစ်</title>
    <link rel="stylesheet" href="css/style.css">

</head>
<body>

    <div class="container">
        <h1>🎟️ ကံစမ်းမဲနှိုက်စနစ် 🎟️ <span class="status-badge">● READY</span></h1>
        
        <div class="top-grid-layout">
            <!-- Left Panel -->
            <div class="card">
                <h2>၁။ မဲစာရင်း ထည့်သွင်းရန်</h2>
                
                <div class="range-box">
                    <div class="range-inputs">
                        <div class="range-field">
                            <label for="rangeFrom">စမည့်နံပါတ် (From):</label>
                            <input type="number" id="rangeFrom" value="1" placeholder="1">
                        </div>
                        <div class="range-field">
                            <label for="rangeTo">ဆုံးမည့်နံပါတ် (To):</label>
                            <input type="number" id="rangeTo" value="100" placeholder="100">
                        </div>
                    </div>
                    <button class="btn-gen-range" onclick="generateRandomRange()">🎲 မဲနံပါတ်များ ထုတ်ယူမည်</button>
                </div>

                <div class="count-control-group">
                    <label for="totalCountInput">ကျန်ရှိသော စုစုပေါင်း မဲအရေအတွက်:</label>
                    <input type="number" id="totalCountInput" min="0" placeholder="စုစုပေါင်း အရေအတွက် ထည့်ရန်...">
                </div>

                <textarea id="numInput" placeholder="မဲနံပါတ်/အမည်များကို စペース၊ ကော်မာ သို့မဟုတ် လိုင်းအသစ်ခြား၍ ထည့်ပါ...&#10;47 12 89 34&#10;17 82 41 9"></textarea>
                
                <div class="options-container">
                    <label class="option-group">
                        <input type="checkbox" id="removeWinner" checked>
                        <span>မဲပေါက်သူကို စာရင်းထဲမှ အလိုအလျောက် ပယ်ဖျက်မည်</span>
                    </label>
                </div>
            </div>

            <!-- Right Panel -->
            <div class="card draw-area">
                <h2>၂။ မဲနှိုက်မှု ထိန်းချုပ်ရန်</h2>
                
                <div class="input-row">
                    <div class="input-control-group">
                        <label for="drawAmount">နှိုက်မည့် မဲအရေအတွက်:</label>
                        <input type="number" id="drawAmount" value="1" min="1">
                    </div>

                    <div class="input-control-group">
                        <label for="animDuration">⏱️ ကြာချိန် (စက္ကန့်):</label>
                        <input type="number" id="animDuration" value="3" min="0" step="0.5">
                    </div>
                </div>

                <label class="skip-box">
                    <input type="checkbox" id="skipAnimationCheck">
                    <span>⚡ Skip Animation (ချက်ချင်း မဲထုတ်မည်)</span>
                </label>

                <div class="display-box" id="displayBox">အဆင်သင့်</div>
                
                <div class="button-group">
                    <button class="btn btn-draw" id="drawBtn" onclick="startBatchDraw()">🎲 မဲစတင်နှိုက်မည်</button>
                    <button class="btn btn-stop" id="stopBtn" onclick="stopBatchDraw()">🛑 ရပ်တန့်မည်</button>
                </div>
            </div>
        </div>

        <!-- Bottom Panel -->
        <div class="card winner-card">
            <h2>
                <span>၃။ မဲပေါက်သူများ စာရင်း (<span id="winnerTotalCount">0</span>)</span>
                <button class="btn btn-clear" onclick="resetWinners()">စာရင်းအားလုံး ဖျက်မည်</button>
            </h2>
            <div class="winner-grid" id="winnerList"><div class="empty-state" id="emptyState">🏆 မဲပေါက်သူ မရှိသေးပါ</div></div>
            <div class="tool-row">
                <button class="mini-btn" onclick="copyWinners()">📋 Winners Copy</button>
                <button class="mini-btn" onclick="downloadWinners('txt')">⬇️ TXT</button>
                <button class="mini-btn" onclick="downloadWinners('csv')">⬇️ CSV</button>
                <button class="mini-btn" onclick="toggleFullscreen()">⛶ Fullscreen</button>
                <button class="mini-btn" onclick="clearAllData()">🧹 Reset All</button>
            </div>
        </div>
        <div class="footer-note">LUCKY DRAW • FAST • FAIR • SIMPLE</div>
    </div>

    <div class="toast" id="toast"></div>
    <script src="js/app.js"></script>

</body>
</html>
